# Build Ghostty.app from the signed upstream tag pinned in UPSTREAM, with the
# patches listed in patches/series, twice on separate runners, then compare
# the two bundles file by file. The comparison is reported, and fails the
# run only when REQUIRE_IDENTICAL is true: reproducibility is measured, not
# yet enforced.
#
# A manual run is a dry run: it builds and compares. Pushing a release tag
# (v<upstream version>+jooize.<n>, annotated) also attests build a's
# archive and publishes it as a GitHub release.
name: build

on:
  workflow_dispatch:
  push:
    tags:
      # "+" is a filter metacharacter; the escape matches it literally.
      - 'v*\+jooize.*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.run }})
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        run: [a, b]
    env:
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/zig/global-cache
    steps:
      - name: Check out this branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: jooize
          persist-credentials: false

      - name: Read pins from UPSTREAM
        run: |
          valid() {
            case "$1" in
              UPSTREAM_REPO) [[ $2 =~ ^https://github\.com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+\.git$ ]] ;;
              UPSTREAM_TAG) [[ $2 =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ;;
              UPSTREAM_COMMIT) [[ $2 =~ ^[0-9a-f]{40}$ ]] ;;
              UPSTREAM_BUILD) [[ $2 =~ ^[0-9]+$ ]] ;;
              UPSTREAM_SIGNER) [[ $2 =~ ^[0-9A-F]{40}$ ]] ;;
              XCODE_VERSION) [[ $2 =~ ^[0-9]+(\.[0-9]+)+$ ]] ;;
              XCODE_BUILD) [[ $2 =~ ^[0-9A-Za-z]+$ ]] ;;
              *) return 1 ;;
            esac
          }
          seen=0
          while IFS= read -r line || [[ -n $line ]]; do
            [[ -z $line || $line == \#* ]] && continue
            key=${line%%=*}
            value=${line#*=}
            if ! valid "$key" "$value"; then
              echo "::error::UPSTREAM: invalid line: $line"
              exit 1
            fi
            echo "$key=$value" >> "$GITHUB_ENV"
            seen=$((seen + 1))
          done < jooize/UPSTREAM
          if [[ $seen -ne 7 ]]; then
            echo "::error::UPSTREAM: expected 7 keys, found $seen"
            exit 1
          fi

      # A release tag names the upstream version it builds; one that names
      # another version is refused before anything is built.
      - name: Check the release tag
        if: github.ref_type == 'tag'
        run: |
          version=${UPSTREAM_TAG#v}
          want="^v${version//./\\.}\+jooize\.[1-9][0-9]*$"
          if [[ ! $GITHUB_REF_NAME =~ $want ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match UPSTREAM_TAG $UPSTREAM_TAG (expected ${UPSTREAM_TAG}+jooize.<n>)"
            exit 1
          fi

      - name: Fetch the upstream tag
        run: |
          git init -q src
          git -C src fetch -q --depth 1 --no-tags "$UPSTREAM_REPO" \
            "+refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"

      - name: Verify the tag signature and commit
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          # A public-key import needs no agent; --no-autostart keeps it from
          # starting one.
          gpg --batch --quiet --no-autostart --import "jooize/keys/$UPSTREAM_SIGNER.asc"
          if ! git -C src verify-tag --raw "$UPSTREAM_TAG" 2> "$RUNNER_TEMP/verify.txt"; then
            cat "$RUNNER_TEMP/verify.txt"
            echo "::error::tag $UPSTREAM_TAG: signature does not verify"
            exit 1
          fi
          # VALIDSIG's last field is the primary key fingerprint.
          signer=$(awk '$2 == "VALIDSIG" { print $NF }' "$RUNNER_TEMP/verify.txt")
          if [[ $signer != "$UPSTREAM_SIGNER" ]]; then
            echo "::error::tag $UPSTREAM_TAG: signed by '$signer', expected $UPSTREAM_SIGNER"
            exit 1
          fi
          commit=$(git -C src rev-parse "refs/tags/$UPSTREAM_TAG^{commit}")
          if [[ $commit != "$UPSTREAM_COMMIT" ]]; then
            echo "::error::tag $UPSTREAM_TAG: points at $commit, expected $UPSTREAM_COMMIT"
            exit 1
          fi
          git -C src checkout -q --detach "$commit"
          echo "tag $UPSTREAM_TAG -> $commit, signed by $signer"

      - name: Apply patches
        run: |
          # Portable to macOS's bash 3.2: no mapfile.
          count=0
          while IFS= read -r p || [[ -n $p ]]; do
            [[ -z ${p//[[:space:]]/} || $p == \#* ]] && continue
            if [[ $p == */* || $p == .* ]]; then
              echo "::error::patches/series: invalid entry: $p"
              exit 1
            fi
            echo "applying $p"
            git -C src apply --index "$GITHUB_WORKSPACE/jooize/patches/$p"
            count=$((count + 1))
          done < jooize/patches/series
          echo "$count patch(es) applied"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: true

      - name: Use upstream's binary cache (read-only)
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          skipPush: true

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app"
          xcodebuild -version | tee "$RUNNER_TEMP/xcode.txt"
          if ! grep -qx "Build version $XCODE_BUILD" "$RUNNER_TEMP/xcode.txt"; then
            echo "::error::expected Xcode build $XCODE_BUILD"
            exit 1
          fi

      # -Dsystem-config=required (system-config.patch): without a protected
      # /etc/ghostty/config.ghostty, the app runs on built-in defaults and
      # ignores user configuration.
      - name: Build GhosttyKit
        working-directory: src
        run: |
          nix develop -c \
            zig build \
            -Doptimize=ReleaseFast \
            -Demit-macos-app=false \
            -Dsystem-config=required \
            -Dversion-string="${UPSTREAM_TAG#v}"

      # Must run outside Nix: upstream notes that Nix breaks xcodebuild.
      - name: Build Ghostty.app
        working-directory: src/macos
        run: xcodebuild -target Ghostty -configuration Release

      # Same version metadata as the upstream release. There are no Sparkle
      # keys to set: no-sparkle.patch removes the updater.
      - name: Update Info.plist
        run: |
          plist=src/macos/build/Release/Ghostty.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :GhosttyCommit ${UPSTREAM_COMMIT:0:9}" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $UPSTREAM_BUILD" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${UPSTREAM_TAG#v}" "$plist"

      # Upstream's signing order, with an ad-hoc signature (-s -) and the
      # hardened runtime, which ignores DYLD_* variables. An ad-hoc signature
      # has no Team ID, so library validation admits only Apple's libraries:
      # the app must link nothing of its own (checked below).
      - name: Sign ad hoc
        working-directory: src/macos
        run: |
          app=build/Release/Ghostty.app
          /usr/bin/codesign -f -s - -o runtime "$app/Contents/PlugIns/DockTilePlugin.plugin"
          /usr/bin/codesign -f -s - -o runtime --entitlements Ghostty.entitlements "$app"
          /usr/bin/codesign --verify --deep --strict "$app"

      # Library validation refuses a bundled framework at launch, which no
      # build step notices. Fail here instead: every library the app links
      # must be Apple's, and the signed app must start. The bundle
      # identifier comes from bundle-id.patch.
      - name: Check that the app starts
        working-directory: src/macos
        env:
          BUNDLE_ID: bar.esko.Ghostty
        run: |
          app=build/Release/Ghostty.app
          bin=$app/Contents/MacOS/ghostty
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          if [[ $id != "$BUNDLE_ID" ]]; then
            echo "::error::bundle identifier is '$id', expected $BUNDLE_ID"
            exit 1
          fi
          own=$(otool -L "$bin" | awk '/^\t/ && $1 !~ /^\/(System\/Library|usr\/lib)\// { print $1 }' | sort -u)
          if [[ -n $own ]]; then
            echo "::error::the app links libraries that are not Apple's:"
            echo "$own"
            exit 1
          fi
          if [[ -e $app/Contents/Frameworks ]]; then
            echo "::error::the app bundles frameworks:"
            ls "$app/Contents/Frameworks"
            exit 1
          fi
          "$bin" --version

      - name: Write manifest and archive
        working-directory: src/macos/build/Release
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          # Every mtime becomes this branch's commit time, so the archive
          # does not carry the time of the build. Signatures do not cover
          # mtimes.
          epoch=$(git -C "$GITHUB_WORKSPACE/jooize" log -1 --format=%ct)
          stamp=$(TZ=UTC date -r "$epoch" +%Y%m%d%H%M.%S)
          TZ=UTC find Ghostty.app -exec touch -h -t "$stamp" {} +
          # One line per file: sha256 or "link:<target>", two spaces, path.
          find Ghostty.app \( -type f -o -type l \) -print0 | LC_ALL=C sort -z |
            while IFS= read -r -d '' f; do
              if [[ -L $f ]]; then
                printf 'link:%s  %s\n' "$(readlink "$f")" "$f"
              else
                printf '%s  %s\n' "$(shasum -a 256 < "$f" | cut -d' ' -f1)" "$f"
              fi
            done > "$out/manifest.txt"
          ditto -c -k --keepParent --norsrc --noextattr --noqtn --noacl \
            Ghostty.app "$out/Ghostty.app.zip"
          wc -l < "$out/manifest.txt"

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.run }}
          path: ${{ runner.temp }}/out
          retention-days: 7
          if-no-files-found: error

      # The Zig tests our patches add, named by patches/test-filters. They run
      # in one build only, after its upload, so both builds take the same steps
      # up to the archive. A failure here fails the run.
      - name: Test the patches
        if: matrix.run == 'a'
        working-directory: src
        run: |
          filters=()
          while IFS= read -r f || [[ -n $f ]]; do
            [[ -z ${f//[[:space:]]/} || $f == \#* ]] && continue
            filters+=("-Dtest-filter=$f")
          done < "$GITHUB_WORKSPACE/jooize/patches/test-filters"
          if [[ ${#filters[@]} -eq 0 ]]; then
            echo "::error::patches/test-filters: no filters"
            exit 1
          fi
          nix develop -c \
            zig build test \
            -Demit-macos-app=false \
            -Dsystem-config=required \
            "${filters[@]}"

  compare:
    needs: build
    runs-on: ubuntu-24.04
    env:
      # true: two builds that differ fail the run, and no release is made.
      REQUIRE_IDENTICAL: "false"
    steps:
      - name: Download both builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*

      # The result goes to the run summary and, as reproducibility.md, into
      # the release notes.
      - name: Compare manifests
        run: |
          total=$(( $(wc -l < build-a/manifest.txt) ))
          if diff -q build-a/manifest.txt build-b/manifest.txt > /dev/null; then
            summary="Reproducible: both builds are identical, all $total files match."
            differing=""
          else
            # diff exits 1 when the inputs differ; that is the expected case here.
            differing=$({ diff <(sort -k2 build-a/manifest.txt) <(sort -k2 build-b/manifest.txt) || true; } |
              sed -n 's/^[<>] [^ ]*  //p' | sort -u)
            count=$(printf '%s\n' "$differing" | grep -c . || true)
            summary="Not reproducible yet: $count of $total files differ between the two builds."
          fi
          mkdir -p out
          {
            echo "## Reproducibility"
            echo
            echo "$summary"
            if [[ -n $differing ]]; then
              echo
              echo '```'
              printf '%s\n' "$differing"
              echo '```'
            fi
          } > out/reproducibility.md
          cat out/reproducibility.md >> "$GITHUB_STEP_SUMMARY"
          echo "$summary"
          if [[ -n $differing && $REQUIRE_IDENTICAL == true ]]; then
            echo "::error::the two builds differ"
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compare
          path: out
          retention-days: 7
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [build, compare]
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release
      id-token: write      # sign the attestation
      attestations: write  # store it
    steps:
      # The tag's message is read from the local repository, so the tag must
      # be checked out here; nothing pushes, so no credentials stay.
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build a
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-a
          path: build-a

      - name: Download the comparison
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compare
          path: compare

      # Everything that can fail runs before the attestation and the
      # release: a protected tag cannot be moved to a fixed workflow.
      - name: Write the release notes and checksums
        run: |
          if [[ $(git cat-file -t "refs/tags/$GITHUB_REF_NAME") != tag ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not annotated; its message is the release notes"
            exit 1
          fi
          mkdir dist
          cp build-a/Ghostty.app.zip build-a/manifest.txt dist/
          (cd dist && shasum -a 256 ./Ghostty.app.zip ./manifest.txt | sed 's| \./| |' > SHA256SUMS)
          {
            git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME"
            body=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")
            if [[ -n $body ]]; then
              echo
              printf '%s\n' "$body"
            fi
            echo
            cat compare/reproducibility.md
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          cat dist/SHA256SUMS

      - name: Attest the archive and its manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Ghostty.app.zip
            dist/manifest.txt

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Ghostty $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            dist/Ghostty.app.zip dist/manifest.txt dist/SHA256SUMS
